<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD iPad Chart DEMO</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1420;color:#e4edf8;font:14px -apple-system,sans-serif}header{padding:12px;background:#192638;display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,input{background:#25384e;color:white;border:1px solid #52667a;border-radius:6px;padding:8px}button.on{background:#087d87}input{width:60px}main{padding:10px}canvas{display:block;width:100%;background:#101c2b;border:1px solid #2b3b4d;border-radius:8px}#price{height:56vh;min-height:280px}#cci{height:17vh;min-height:100px;margin-top:8px}.info{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0}.red{color:#ff717a}.blue{color:#66adff}.note{font-size:12px;color:#a8b9ca;line-height:1.6}</style></head><body><header><strong>GOLD 自動高値・安値</strong><span style="color:#ffc46d">DEMO・模擬データ</span><button data-tf="T100" class="on">T100模擬</button><button data-tf="M1">M1模擬</button><button data-tf="M5">M5模擬</button><label>期間 <input type="number" id="period" value="20" min="2" max="100"></label><button id="refresh">模擬更新</button></header><main><canvas id="price"></canvas><canvas id="cci"></canvas><div class="info"><span class="red" id="hi"></span><span class="blue" id="lo"></span><span id="last"></span><span id="cv"></span></div><p class="note">赤・青の水平線は直近N本の確定足の最高値・最安値です。黄色はBB(20,2)、下段はCCI(20)。<br>すべて架空の価格です。cTrader/Axioryには接続しておらず、注文も行いません。APIキーなどを入力しないでください。</p></main><script>
let tf='T100',bars=[];const pc=document.getElementById('price'),cc=document.getElementById('cci');let seed=1;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function generate(){seed=({T100:101,M1:202,M5:303})[tf]+Math.floor(Date.now()/86400000)%1000;bars=[];let p=4045;for(let i=0;i<120;i++){let o=p;p=o+(rnd()-.5)*(tf==='M5'?1.6:.85);bars.push({o,c:p,h:Math.max(o,p)+rnd()*.35,l:Math.min(o,p)-rnd()*.35})}draw()}function ctx(c){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);let g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return[g,r.width,r.height]}function stroke(g,color,fn,width=1){g.beginPath();fn();g.strokeStyle=color;g.lineWidth=width;g.stroke()}function draw(){if(!bars.length)return;let [g,w,h]=ctx(pc),n=bars.length,left=8,right=70,pw=w-left-right,high=Math.max(...bars.map(b=>b.h)),low=Math.min(...bars.map(b=>b.l)),margin=(high-low)*.12||1;high+=margin;low-=margin;let y=v=>10+(high-v)/(high-low)*(h-25),x=i=>left+(i+.5)*pw/n;g.font='11px sans-serif';for(let k=0;k<=5;k++){let v=low+(high-low)*k/5;stroke(g,'#263648',()=>{g.moveTo(left,y(v));g.lineTo(w-right,y(v))});g.fillStyle='#a2b5c9';g.fillText(v.toFixed(2),w-right+5,y(v)+4)}let close=bars.map(b=>b.c),means=[],upper=[],lower=[];for(let i=0;i<n;i++){if(i<19)continue;let s=close.slice(i-19,i+1),m=s.reduce((a,b)=>a+b,0)/20,sd=Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/20);means[i]=m;upper[i]=m+2*sd;lower[i]=m-2*sd}for(let arr of [upper,lower])stroke(g,'#e8c94b',()=>{for(let i=19;i<n;i++){if(i===19)g.moveTo(x(i),y(arr[i]));else g.lineTo(x(i),y(arr[i]))}},1.4);for(let i=0;i<n;i++){let b=bars[i],col=b.c>=b.o?'#13b38c':'#e46a59';stroke(g,col,()=>{g.moveTo(x(i),y(b.h));g.lineTo(x(i),y(b.l))});g.fillStyle=col;g.fillRect(x(i)-Math.max(1,pw/n*.33),Math.min(y(b.o),y(b.c)),Math.max(2,pw/n*.66),Math.max(1,Math.abs(y(b.o)-y(b.c))))}let period=Math.max(2,Math.min(100,Number(document.getElementById('period').value)||20)),confirmed=bars.slice(-period-1,-1),hi=Math.max(...confirmed.map(b=>b.h)),lo=Math.min(...confirmed.map(b=>b.l));for(let [v,col] of [[hi,'#ff727b'],[lo,'#66adff']]){stroke(g,col,()=>{g.moveTo(left,y(v));g.lineTo(w-right,y(v))},2.4);g.fillStyle=col;g.fillText(v.toFixed(2),w-right+5,y(v)-5)}document.getElementById('hi').textContent='高値 '+hi.toFixed(2);document.getElementById('lo').textContent='安値 '+lo.toFixed(2);document.getElementById('last').textContent='終値 '+bars.at(-1).c.toFixed(2);let [z,cw,ch]=ctx(cc),mid=ch/2;stroke(z,'#506070',()=>{z.moveTo(left,mid);z.lineTo(cw-right,mid)});let typ=bars.map(b=>(b.h+b.l+b.c)/3),values=[];for(let i=19;i<n;i++){let s=typ.slice(i-19,i+1),m=s.reduce((a,b)=>a+b,0)/20,dev=s.reduce((a,b)=>a+Math.abs(b-m),0)/20;values[i]=dev?(typ[i]-m)/(.015*dev):0}stroke(z,'#66db98',()=>{for(let i=19;i<n;i++){let yy=mid-Math.max(-250,Math.min(250,values[i]))*ch/600;if(i===19)z.moveTo(x(i),yy);else z.lineTo(x(i),yy)}},1.8);document.getElementById('cv').textContent='CCI '+values[n-1].toFixed(0)}document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{tf=b.dataset.tf;document.querySelectorAll('[data-tf]').forEach(v=>v.classList.toggle('on',v===b));generate()});document.getElementById('period').onchange=draw;document.getElementById('refresh').onclick=generate;window.addEventListener('resize',draw);generate();</script></body></html>
