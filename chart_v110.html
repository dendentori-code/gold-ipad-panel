<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOLD Dual Chart v1.10 DEMO</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1521;color:#e6eff9;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px}header{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 12px;background:#192a3c}strong{font-size:16px}.warn{color:#ffca77}button,input{background:#233a50;color:#fff;border:1px solid #4b6074;border-radius:5px;padding:7px}button{cursor:pointer}input{width:52px}.charts{padding:8px;display:grid;gap:9px}.panel{background:#111f2e;border:1px solid #2a4054;border-radius:8px;padding:7px}.title{display:flex;justify-content:space-between;margin:2px 5px 6px;font-weight:700}.title small{font-weight:400;color:#a7c0d4}.plot{width:100%;height:29vh;min-height:185px;display:block}.cci{width:100%;height:9vh;min-height:65px;display:block;margin-top:5px}.foot{display:flex;flex-wrap:wrap;gap:12px;margin:6px 5px 0;color:#b7c6d7}.hi{color:#ff747c}.lo{color:#65b4ff}.notice{color:#a9b9c8;font-size:11px;padding:0 12px 12px;line-height:1.5}@media(max-height:680px){.plot{height:25vh;min-height:130px}.cci{height:8vh;min-height:45px}}
</style></head><body><header><strong>GOLD 2画面 v1.10</strong><span class="warn">DEMO・模擬データ／注文不可</span><label>高安期間 <input id="period" type="number" value="20" min="2" max="80"></label><button id="refresh">模擬データ更新</button></header>
<div class="charts"><section class="panel"><div class="title"><span>上段｜XAUUSD 100 TICK（模擬）</span><small>BB 20,2 ／ CCI 20</small></div><canvas class="plot" id="top"></canvas><canvas class="cci" id="topcci"></canvas><div class="foot" id="topstats"></div></section>
<section class="panel"><div class="title"><span>下段｜XAUUSD M1（模擬）</span><small>BB 20,2 ／ CCI 20</small></div><canvas class="plot" id="bottom"></canvas><canvas class="cci" id="bottomcci"></canvas><div class="foot" id="bottomstats"></div></section></div>
<div class="notice">赤＝確定済み直近N本の最高値、青＝最安値。黄色＝BB、下段の緑線＝CCI。2画面のサンプル系列は別々に生成したもので、実際の市場・時間足間の整合性はありません。API未接続のためリアルタイム価格ではありません。</div>
<script>
let data={};let nonce=0;function rng(seed){return()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}}
function make(seed){let r=rng(seed),v=4046,a=[];for(let i=0;i<110;i++){let o=v;v+= (r()-.5)*.75;let h=Math.max(o,v)+r()*.3,l=Math.min(o,v)-r()*.3;a.push({o,h,l,c:v})}return a}
function size(c){let rect=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(rect.width*d);c.height=Math.round(rect.height*d);let ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return{ctx,w:rect.width,h:rect.height}}
function drawPath(ctx,points,color,width=1,dash=[]){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}
function cci(b,i){if(i<19)return null;let t=b.map(x=>(x.h+x.l+x.c)/3),m=0;for(let j=i-19;j<=i;j++)m+=t[j]/20;let md=0;for(let j=i-19;j<=i;j++)md+=Math.abs(t[j]-m)/20;return md?(t[i]-m)/(.015*md):0}
function render(key,canvasId,cciId,statsId){let b=data[key],{ctx:x,w,h}=size(document.getElementById(canvasId)),N=b.length,side=67,left=8,ww=w-side-left,ph=h-12;
let lo=Math.min(...b.map(v=>v.l)),hi=Math.max(...b.map(v=>v.h)),pad=(hi-lo)*.12||.2;lo-=pad;hi+=pad;const X=i=>left+(i+.5)*ww/N,Y=v=>6+(hi-v)/(hi-lo)*(ph-6);
x.font='11px sans-serif';for(let k=0;k<5;k++){let val=lo+(hi-lo)*k/4,y=Y(val);drawPath(x,[[left,y],[w-side,y]],'#2b4051');x.fillStyle='#a2b4c6';x.fillText(val.toFixed(2),w-side+5,y+4)}
for(let i=19;i<N;i++){let mean=0;for(let j=i-19;j<=i;j++)mean+=b[j].c/20;let v=0;for(let j=i-19;j<=i;j++)v+=(b[j].c-mean)**2/20;let sd=Math.sqrt(v);b[i].bbHi=mean+2*sd;b[i].bbLo=mean-2*sd}
for(let k of ['bbHi','bbLo'])drawPath(x,b.slice(19).map((v,j)=>[X(j+19),Y(v[k])]),'#e5c34c',1.2);
b.forEach((v,i)=>{let xx=X(i),color=v.c>=v.o?'#24b994':'#e36c63';drawPath(x,[[xx,Y(v.h)],[xx,Y(v.l)]],color);x.fillStyle=color;x.fillRect(xx-Math.max(1,ww/N*.33),Math.min(Y(v.o),Y(v.c)),Math.max(2,ww/N*.66),Math.max(1,Math.abs(Y(v.o)-Y(v.c))))});
let period=Math.min(80,Math.max(2,Number(document.getElementById('period').value)||20)),closed=b.slice(-period-1,-1),high=Math.max(...closed.map(v=>v.h)),low=Math.min(...closed.map(v=>v.l));
for(let [v,color] of [[high,'#ff737d'],[low,'#61b1ff']]){let y=Y(v);drawPath(x,[[left,y],[w-side,y]],color,2);x.fillStyle=color;x.fillText(v.toFixed(2),w-side+5,y-5)}
let q=size(document.getElementById(cciId)),c=q.ctx,cy=q.h/2,scale=q.h*.33/180;for(let v of [-100,0,100])drawPath(c,[[left,cy-v*scale],[q.w-side,cy-v*scale]],'#385067',1,v?[3,3]:[]);
let pts=[];for(let i=19;i<N;i++){let v=cci(b,i);pts.push([X(i),cy-Math.max(-250,Math.min(250,v))*scale])}drawPath(c,pts,'#63d3a0',1.6);
document.getElementById(statsId).innerHTML='<span class="hi">高値 '+high.toFixed(2)+'</span><span class="lo">安値 '+low.toFixed(2)+'</span><span>終値 '+b.at(-1).c.toFixed(2)+'</span><span>CCI '+cci(b,N-1).toFixed(0)+'</span>'}
function renderAll(){if(!data.t)return;render('t','top','topcci','topstats');render('m','bottom','bottomcci','bottomstats')}
function regenerate(){nonce++;data.t=make(109+nonce*13);data.m=make(992+nonce*17);renderAll()}
document.getElementById('period').onchange=renderAll;document.getElementById('refresh').onclick=regenerate;window.addEventListener('resize',renderAll);regenerate();
</script></body></html>
